name: Feature
description: Propose a command, a router improvement or a new capability.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What mobile development problem does this solve?
      description: reis-mobile is focused on mobile. Describe the real pain before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working. Command or output examples help.
    validations:
      required: true
  - type: dropdown
    id: stacks
    attributes:
      label: Affected stacks
      multiple: true
      options:
        - Flutter
        - Android
        - iOS
        - React Native
        - Kotlin Multiplatform
        - All
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I can open the pull request for this feature.
