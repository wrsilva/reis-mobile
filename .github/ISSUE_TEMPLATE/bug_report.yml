name: Bug
description: Something in reis-mobile does not work as it should.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before submitting, check whether a [similar issue](https://github.com/wrsilva/reis-mobile/issues?q=is%3Aissue) already exists.
        **Do not paste secrets, tokens or proprietary code.**
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Stack detection
        - Router (wrong intent, agent or skills)
        - /mobile:doctor
        - /mobile:review
        - Agent
        - Skill
        - Installation or update
        - CLI
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the current and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command run, prompt used and project type (Flutter, Android, iOS, React Native, KMP).
      placeholder: |
        1. In a Flutter app with android/ and ios/
        2. Run `reis-mobile route "..."`
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Output of `reis-mobile route`, `reis-mobile detect --json` or `reis-mobile doctor`, when relevant.
      render: text
  - type: input
    id: version
    attributes:
      label: reis-mobile version
      description: Output of `reis-mobile --version` and/or `claude plugin list | grep -A1 reis-mobile`.
      placeholder: reis-mobile 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - curl (install.sh)
        - PowerShell (install.ps1)
        - Homebrew
        - npm
        - Claude Code plugin only
        - Local clone
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, `node --version` and Claude Code version.
      placeholder: macOS 26, Node 22.12, Claude Code 2.x
