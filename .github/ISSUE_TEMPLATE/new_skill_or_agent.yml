name: New skill or agent
description: Propose a skill or an agent specialized in mobile.
title: "[skill] "
labels: ["skill", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Small, specific skills are more useful than generic ones: prefer `ios-signing-debug` over `mobile-development`.
        See the rules in [AGENTS.md](https://github.com/wrsilva/reis-mobile/blob/main/AGENTS.md).
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Skill
        - Agent
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Suggested name
      description: kebab-case with the stack prefix (`flutter-*`, `android-*`, `ios-*`, `rn-*`, `kmp-*`) or `mobile-*`.
      placeholder: android-gradle-debug
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When it should be used
      description: Situations and requests that should trigger it. This becomes the frontmatter `description`.
    validations:
      required: true
  - type: dropdown
    id: stacks
    attributes:
      label: Stacks
      multiple: true
      options:
        - flutter
        - android
        - ios
        - react-native
        - kotlin-multiplatform
        - "* (all)"
    validations:
      required: true
  - type: dropdown
    id: intents
    attributes:
      label: Intents for which the router should load it
      multiple: true
      options:
        - review
        - debug
        - test
        - security
        - performance
        - architecture
        - release
        - accessibility
        - migration
        - dependency
        - build
        - deployment
        - None (manual routing)
  - type: textarea
    id: source
    attributes:
      label: Origin
      description: Is it original content? If it comes from another project, provide the link and the license. We only accept licenses that allow redistribution.
    validations:
      required: true
