name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

# GitHub has delivered the same tag push twice; the steps below are safe to repeat.
concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check versions match the tag
        run: node scripts/versions.mjs "$TAG"

      - name: Validate and test
        run: npm run check

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "reis-mobile ${TAG}" --generate-notes

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "reis-mobile@${TAG#v}" version >/dev/null 2>&1; then
            echo "reis-mobile@${TAG#v} is already on npm"
          else
            npm publish --provenance --access public
          fi
