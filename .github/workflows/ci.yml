name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Synchronize release files
        run: npm run version:sync
      - name: Validate plugin
        run: npm run validate
      - name: Test
        run: npm test

  package:
    name: Installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize release files
        run: npm run version:sync
      - name: Pack and install globally
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/reis-mobile-*.tgz
      - name: Run the installed CLI
        shell: bash
        run: |
          reis-mobile --version
          reis-mobile validate
          reis-mobile test --json --lang en --dir "$RUNNER_TEMP"
